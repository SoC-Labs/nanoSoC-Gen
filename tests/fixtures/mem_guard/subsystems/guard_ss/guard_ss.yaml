# Guard fixture subsystem: its IMEM width defaults to 15 and the top passes
# 13. A discovery table that resolved the default would report 4x.
module:
  name: guard_ss
  gen: True
  desc: "Subsystem with its own RAM behind its own interconnect"
  params:
    SYS_ADDR_W: { type: int, default: 32, desc: "System address width" }
    SYS_DATA_W: { type: int, default: 32, desc: "System data width" }
    IMEM_W:     { type: int, default: 15, desc: "IMEM byte address width" }
  interfaces:
    - { name: sys_hclk,    type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB clock in" }
    - { name: sys_hresetn, type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB reset in" }
    - { name: sub_s, type: ahb, direction: target, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W, EXCLUDE: [hready] }, desc: "External slave window" }
  instances:
    - instance_name: u_imem_0
      module: guard_ram_region
      addressable: True
      params: { SYS_ADDR_W: $SYS_ADDR_W, SYS_DATA_W: $SYS_DATA_W, RAM_ADDR_W: $IMEM_W }
      connections:
        - { port: HCLK,      conn: sys_hclk }
        - { port: HRESETn,   conn: sys_hresetn }
        - { port: ahb_slave, conn: guard_ss_ic.imem_0 }
  interconnects:
    - name: guard_ss_ic
      gen: True
      type: ahb_lite
      desc: "Subsystem interconnect"
      params:
        SYS_ADDR_W: $SYS_ADDR_W
        SYS_DATA_W: $SYS_DATA_W
      connections:
        - { port: sys_hclk,    conn: sys_hclk }
        - { port: sys_hresetn, conn: sys_hresetn }
      targets:
        - { name: imem_0, instance: u_imem_0, base: 0x00000000, size: 0x10000000, sw_access: rwx, region_type: memory, phys_size: "@SS_PHYS@", desc: "Subsystem IMEM" }
      initiators:
        - name: sub_s
          passthrough: sub_s
          targets:
            - name: imem_0
